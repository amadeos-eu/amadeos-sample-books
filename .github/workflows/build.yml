name: Build

# develop builds X.Y.Z-dev.N, release X.Y.Z-pre.N and main the release X.Y.Z, which the release job
# tags and publishes with the package (see CONTRIBUTING.md of datazuul/amadeos, "Commits and versions").
on:
  push:
    branches: [develop, release, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The version is computed from the history since the last release tag.
          fetch-depth: 0
      - id: version
        uses: amadeos-eu/amadeos-ci/version@main
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Check the books and build the package
        run: ./gradlew check deb --no-daemon -PappVersion=${{ steps.version.outputs.version }}
      - name: Check the package
        run: |
          deb=$(ls build/distributions/amadeos-sample-books_*_all.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | tee contents.txt
          count=$(grep -c '\.epub$' contents.txt)
          listed=$(grep -cv '^#' books.tsv)
          echo "Books in the package: $count of $listed"
          test "$count" -eq "$listed"
          grep -q 'usr/share/doc/amadeos-sample-books/copyright' contents.txt
          test "$(dpkg-deb --field "$deb" Version)" = "${{ steps.version.outputs.deb-version }}"
      - name: Upload the Debian package
        uses: actions/upload-artifact@v7
        with:
          name: amadeos-sample-books-deb
          path: build/distributions/*.deb

  # Only on main, after the release branch was promoted: tag vX.Y.Z and publish the GitHub Release.
  release:
    needs: build
    if: needs.build.outputs.channel == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: amadeos-sample-books-deb
          path: dist
      - uses: amadeos-eu/amadeos-ci/release@main
        with:
          version: ${{ needs.build.outputs.version }}
          files: dist/*.deb

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: amadeos-eu/amadeos-ci/check-commits@main
